update reasoning and reconciliation: 'Integrating sponsor accountability for certification
  and embedding continuous improvement/experimentation changes the scope: this phase
  now acts as a quality gateway and an incubation site for research-driven enhancements.
  No conflicts arise; the updates are reinforcing.'
updated description: This sub-process completes loading of collected data and metadata
  and now includes formal sponsor certification, ensuring that collection activities
  meet specified requirements for downstream statistical processing. Additionally,
  it acts as a center for world-leading research and experimentation on collection
  methods, supporting forums and innovation panels for continuous improvement and
  improvement of statistical rigour. Documentation, review of metadata and paradata,
  and archiving are all enhanced by new research-driven protocols.
