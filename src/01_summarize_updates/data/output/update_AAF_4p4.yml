id: '4.4'
text: Finalise collection
description: This sub-process includes loading the collected data and metadata into
  a suitable electronic environment for further processing. It may include manual
  or automatic data capture, for example, using clerical staff or optical character
  recognition tools to extract information from paper questionnaires, or converting
  the formats of files or encoding the variables received from other organisations.
  It may also include analysis of the metadata and paradata associated with collection
  to ensure the collection activities have met requirements. In cases where there
  is a physical collection instrument, such as a paper questionnaire, which is not
  needed for further processing, this sub-process manages the archiving of that material.
  When the collection instrument uses software such as an API or an app, this sub-process
  also includes the versioning and archiving of these. The data could be pseudonymised
  at this stage before further processing.
implicated updates:
  - slide number: 7
    reference: GSBPM Roadmap Data In
    quote: Clear delineation sponsor (subject matter) roles and accountabilities,
      based on the minimum requirement that sponsors / subject matter are responsible
      for specification and certification (1.4, 1.5, 3.1, 4.4)
    distribution reasoning: Update strengthens accountability in certifying collected
      data for downstream processes.
  - slide number: 8
    reference: GSBPM Roadmap Data In
    quote: 'Investments in world leading collection research (4.4)

      Implementation of experimentation mechanisms, including LFS Innovation Panel,
