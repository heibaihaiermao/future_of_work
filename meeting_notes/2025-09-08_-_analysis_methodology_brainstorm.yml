  - topic: Project Phases
    background: null
    details:
      - item: SM proposal
        description: |
          0) Environmental setup
          1) Data-driven updates to GSBPM
          2) Mapping updated GSBPM to future activities and skills gaps.
      - item: LG proposal for SSC intake
        summary: |
          1) Environmental scan and research (3 months)
          2) Analysis and Mapping of GSBPM processes (3 months)
          3) Mapping GSBPM to current work descriptions (3 months)
          4) Mapping key activities to substitute requirements (3 months)
        details:
          - item: 1) Environmental scan and research (3 months)
            summary: null
            details:
              - Research and analysis of literature related to NSOs.
              - Intake of various academic articles.
              - Summarization and analysis and structuring of information and data.
              - Extraction of trends, themes.
              - Review of historical evolution on topics by date of publication.

          - item: 2) Analysis and Mapping of GSBPM Processes (3 months)
            summary: null
            background: >
                GSBPM (Generic Statistical Business Process Model) is an international
                framework outlining the core statistical processes. The framework will
                serve as a baseline for assessing transformation.
            details:
              - Review and analyze of all the business processes listed.
              - Review and identification of those that involve manual collection,
                processing, etc.

          - item: 3) Mapping GSBPM to current work descriptions (3 months)
            summary: null
            details:
              - Review and mapping of these processes against work description key
                activities (unclassified data in a database PCIS and internal StatCan
                repository of job descriptions
              - Identify gaps between requirements and work descriptions
              - Identify gaps between skills and existing work descriptions

          - item: 4) Mapping key activities to substitute requirements (3 months)
            summary: null
            details:
              - Review and map these key activities that identify manual or repetitive
                activities
              - Identify forward facing requirements linked to information obtained
                via the literature review Part 1.
            outstanding: &outstandingPhases4
              - question: Specifically what "substitute requirements"?
                answer: null
              - question: What are the "substitute requirements" substituting?
                answer: Those requirements imposed by the GSBPM.



  - topic: Identifying data sources for context, input, direction, or testing.
    summary: |
      In determining a methodology we can yield summaries for many of the provided
      sources. Doing so should assist in

      LG presented the following as (roughly) the hierarchy of importance of our
      data sources.

        1. GSBPM
        2. Strategic priority deck (this is the "WHAT")
        3. Program area input
        4. Top core areas and themes (ideally case-study tests)
        5. Generic work descriptions (Test)

      The last of these, Generic work descriptions, may be useful for quality
      assurance by comparing them with the case studies.
    details:
      style:
        - item: SMC presentations
          value: >
            Using LLM we can determine the overall structure of these presentations,
            and can identify the importance of elements by comparing the content
            to the feedback provided. All of this is available on the intranet.
            (This is an alternative to using the HR SMC template).
        - item: HR SMC template
          value: >
            HR has the subject matter expertise that is closest to what we are
            attempting to do. Using their template for SMC presentations might be
            helpful in structuring our presentation deliverable.
            (This is an alternative to deriving an SMC template from published SMC
            presentations).
      context:
        - item: !specify processes
          background: !fill null
          value: !fill null
        - item: !specify directives
          background: !fill null
          value: >
            identify which elements of GSBPM are appropriate for automation or
            AI-assistance.
        - item: Skills gap assessment
          background: !fill null
          value: !fill null
        - item: OECD publication, "Common Human Resources Business Process (CHRBP)"
          background: >
            Publication that intended to standardize HR business processes across
            GoC. Seems to have disappeared.
          value: !validate Document has similar objectives?
        - item: PSMAC publication
          background: !fill null
          value: !validate "A previous attempt for what we're doing to do now"
      inputs:
        description: >
          item-wise data, these items will be individually processed to yield data
          extract, summary, transformation or generation. These items may be used
          at distinct steps of the analysis, and even used repeatedly.
        items:
        - item: Field feedback of GSBPM key changes.
          background: !fill null
          value: >
            Extract elements from field feedback to identify common elements, and
            strategize for areas of revision.
        - item: work descriptions
          background: >
            Two categories of work descriptions are kept, generic work-descriptions
            are kept public, and unique work descriptions (for one-off employment)
            are kept in a private repository maintained by "our classification
            folks".
          value:
            - trend analysis on unique work descriptions, analyzing trends of
              core activities (inferred by the responsibilities or skills listed).
            - !deliverable Proposed changes to generic work-descriptions, following
              from the forecasted changes to GSBPM.
        - item: Case studies from "StatCan 2030 EBA Platforms Update SMC"
          value: >
            These case studies should be readily produced by the LLM following our
            methodology. Although LLM output might not be identical it is a litmus
            test to evaluate the methodology against expected results.
