  - FoW
  - brainstorming
  - SMC
summary: |
  Our conversation began to strategize what concrete and realistic deliverables
  would be for the project. Similarly open-ended projects had issues with scope-creep
  and political-reframing. Fortunately there is a hard deadline and deliverable that
  will help guide us, an SMC presentation on November 12 or 16.

  Challenges for the developing a methodology for analysis include non-alignment
  between the GSBPM and the established HR processes interacting with work
  descriptions. Moreover, work-descriptions are flexible definitions and so
  mappings between changes to GSBPM have multiple (contradictory) interpretations
  for work descriptions should be changed. Furthermore, with such a short timeline
  for the project there is little time for consultation, collaboration or research.
  Our recommendations should also align with our international statistical office
  partners. There are few existing examples of similar project attempts that might
  be leveraged as examples for the LLM's analysis. However, what we present to SMC
  may be limited to a proof of concept and a roadmap for incorporating consultation,
  quality assurance, and international alignment into the project deliverables.

  The conversation turned to what inputs, outputs, and intermediate forms would be
  appropriate for our methodology. In discussion with the LLM, we expect to begin
  by structuring the direction given to the fields (eg. "A glimpse of the future"
  from "Tier 2 Committee Visions for the future of the agency"). The implementations
  produced by various fields would be mined by the LLM to populate this structure.
  Common elements among structured field plans will provide insight into what items
  of the GSBPM are most targeted. It can be assumed that the most targeted areas are
  also the most in-need of revision.

  LG identified case-studies as possible integrity tests for the LLM methodology.
  She also suggested focusing on particular work descriptions such as
  "EC-03 Operations Coordinator (700-202)",
  "EC-02 Data Production and Dissemination Officer (900-218)", and
  "EC-01 Recruit (900-200)".

  The next step in developing the methodology is to draw a process diagram,
  illustrating inputs, outputs, and processing.

