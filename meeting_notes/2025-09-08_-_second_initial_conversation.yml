            GSBPM.
          - Examples of "HOW" include data collection. One might target data-mining
            (nano-data) rather than focusing on collection through surveys
            (micro-data).
        details:
          - Hypothesized "blurring of boundaries" due to technological advances,
            therefore working to articulate impact this will have on StatCan and
            future of work.
          - Content created by management to be organized and evaluated for elements
            for GSBPM (activities) update.
          - SM described content as "a bunch of links" that need summarization.
          - LG emphasized curating the update content for elements which we have
            control over, such as updating job descriptions and not proposing new
            job classifications.
          - LG proposed analysis that directs what is done with classification, rather
            than what new classifications might fill any identified gap. This aligns
            with her observation that the same work descriptions are designed without
            alignment with "activity" (GSBPM) and that work descriptions are used
            differently across "domains".
        outstanding:
