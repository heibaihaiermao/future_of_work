summary: |
  This initial meeting with subject matter experts from HR was the first of a series of weekly consultations.
  Key elements that progressed in this meeting were the role of SME, and sources of relevant data.
  Following the meeting ET and LG had a major debrief that elaborated on the meeting contents and added important
  context.

description: |
  Victoria Maamari and Marissa Van Der Velden provided expertise on what relevant information to use (data sources),
  particular items of importance are the Skills-gap survey and work-descriptions. The Skills-gap survey documents a
  previous effort to anticipate the future skills of employees, and the gap from their current skills. Analysis from
  this survey broke responses down by job classification. Since the ultimate target of our analysis is
  work-descriptions (which list skills), results from the Skills-gap survey might of provided a key source of
  validation for both "technical" and "interpersonal" skills. However, the survey methodology is unknown, raising
  risk of apples-to-oranges comparison. Moreover, without having been conducted with the context of updates to the
  GSBPM, the survey likely "points" towards a different vision of the future. Nonetheless, having been raised by the
  SME, the Skills-gap survey must be address in our final reporting.

  We also had useful discussions regarding work-descriptions. Though work-descriptions are the ultimate target of
  our analysis, there remains some disagreement regarding their quality, relevance, and whether they align with
  employee activity. In our debrief LG pointed out that upto 80% of an employees work need not align with their work
  description, and that many work-descriptions where published 10-20-30 years ago. There may be substantial need for
  updates to the work-descriptions. On the other hand, in the meeting Victoria raised results from the Skills-gap
  survey that suggested that the "top 5 [activities/skills?] consistently aligned with work-descriptions".
  Ultimately however, LG proposed in the debrief that work-descriptions are written so generally
  (for hiring expediency) that they cannot be used to reconstruct the SBP. This highlights an intelligence gap
  between proposed changes to the GSBPM and the work-descriptions.

  Lastly, there was some discussion about what outcomes we should anticipate, and how to appropriately map to an
  ultimate target. It was raised that both fields and roles (work-descriptions) that were previously involved in 
  a given SBP may not be in the future. This highlights a design decision, whether it is more appropriate to
  map updates to the GSBPM to fields or to roles. Currently the project plan is to map onto roles (work-descriptions).
  It still may be that we find mapping changes to field adjustments may be more strategically advantageous, since
  roles are general and fields provide specific services. This question relates to the above mentioned "gap" between
  GSBPM updates and work-descriptions.

background:
  - Saeid Molladavoudi has an SMC presentation on November 12th, and must got to HRC two weeks prior.
  - The presentation will summarize updates to StatCan's Statistical Business Processes (within framework of GSBPM),
    and propose strategic adjustments to existing work-descriptions.
  - The underlying assumption is that work-descriptions reflect sub-activities of StatCan's SBPs.
  - Since the analysis is mapping onto work-descriptions, SME from HR were brought in for consultation.
  - !definition Job family, are categories of job. "work descriptions belong to /pronounced/ job families"
details:
  - topic: Data sources
    summary: null
    background: null
    details:
          - item: Skills-gap survey
            summary: >
              The Skills-gap survey identified anticipated changes to employees skills. The context and methodology
              mean the survey is not a good alternative to our analysis. However our report must address the survey.
            background:
              - !verify Skills-gap survey sought to measure the discrepancies between an individual's
                classification/skills and their work description.
              - !verify The methodology relied on self reporting current and future expectations of employee's skills.
              - It was found that there was large alignment, "top 5 ____ consistently matched work descriptions".
            details: 
              - The Skills-gap survey offers a point of comparison. It provides another effort in anticipating
                changes to employees skills, a proxy for their activities. However the methodology of the survey
                was not reviewed prior to deployment, and the data returned is all free text. 

              - Furthermore the survey was done without the context of the GSBPM, therefore anticipated changes in
                skills might reflect a variety of drivers (eg. SAS-to-Open-source).

              - Having been suggested as a point of comparison, or input to our analysis, it must be addressed.

              - Existing analysis breaks down the skills-gap data by classification/box. This includes interpersonal
                skills
            outstanding: &outstandingt1i1
              - Is there any reason why interpersonal or "soft" skills must or should be treated differently than
                other skills, either in our analysis or our reporting?
              - Are the changes to the GSBPM only "technical" skills?

          - item: Work descriptions
            summary: >
              Work descriptions are the ultimate target of our analysis. They may be used in additional ways, and have
              some quality issues. (see details).
            background:
              - Work-descriptions are written broadly so they may be flexible used to justify staffing existing boxes.
              - Many work-descriptions are outdated, and so may not be a safe object for validation.
              - A maximum of 80% of an employees work may be unrelated to his job description.
            details:
              - work-descriptions may also be used to produce intermediate intelligence products. For example,
                unique work-descriptions could be analyzed for trends in key activities.
              - !validate work-descriptions for any given SBP are accessible on the ICN.

          - item: Missing program area inputs from fields 1, 6, 8
            summary: null
            background: null
            details:
              - item: content from field 1 will provide information on "the future of how"
            outstanding: &outstanding1t3i
              - Is collecting information on field 6 a CoI?
              - What is "the future of how", we need a better term for what we are drafting.

          - item: Job descriptions or posters
            summary: >
              Job descriptions might serve to identify trends in hiring, however this would be without GSBPM context.

  - topic: Role of SME
    summary: >
      Subject matter experts are expected to provide relevant sources of context, data for bootstrapping, and
      human-in-the-loop validation of produced analysis.
    background: null
    details:
      - Some relevant sources of information are gate-kept by SMEs. For example unique work-descriptions.
      - SMEs can identify which fields are implicated each SBP. This can direct analysis on SBP updates, possibly
        by limiting which fields input is used in the analysis for which SBP.
      - !verify SMe can access who, involved in an SBP, is staffed; what field they work in,
        what classification, what job description.

      - ET> Have SME validate methodology, rather than outputs, so not to bias final results.
    outstanding: &outstanding1t2i
      - What are the data sources for determining which employees are involved in a given SBP?


  - topic: Anticipated outcomes
    summary: null
    background: null
    details:
      - Fields currently involved in a SBP might no longer be.
      - Roles (as determined by work-descriptions) currently involved in a SBP might no longer be.
      - It can be argued whether or not fields or roles should be the analysis target.

  - topic: !future Future projects
    summary: >
      Subsequent analysis could identify how SoMC be updated to reflect the forecasted changes to work-descriptions.

  - topic: Project phases
    summary: null
    background: See 2025-09-09_-_analysis_methodology_brainstorm.yml, in the detail "Project phases"
    details: null
      - Marissa> "first use generic work-descriptions."
      - SM> Future of GSBPM first.

  - topic: SSC environment
    summary: >
      ET to setup SSC environment, and to onboard Marissa and Victoria.




outstanding:
  - *outstandingt1i1
  - If we are synthesizing updates to SBP, shouldn't we have SME on these processes (or GSBPM)?
  - What is HRC? Why does SM have to go to it?
