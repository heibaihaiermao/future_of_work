  - topic: Project Scope
    summary: null
    background: >
      review previous "project scope" items in "2025-09-09_-_first_weekly_touchbase.yml"
      and "2025-09-08_-_analysis_methodology_brainstorm.yml"
    details:
      - item: Analysis stratification or aggregation.
        summary: >
          There is a design decision to be made whether the results are agency-wide,
          or applied to each field.
        background: null
        details:
          - LG> Project is supposed to be specific to individual fields.
          - !recall "2025-09-09_-_first_weekly_touchbase.yml" description discusses the
            applicability of results to either fields or role (work-descriptions.)
          - For example, if the analysis were applied to fields, one might find
            something (hypothetically) like "finance will no longer be involved in hiring".
            As a counter example, if analysis were applied to work-descriptions, one ight
            find something (hypothetically) like "hiring will no longer involve finacial
            analysts".

          - The two previous examples are pretty cut-and-dry, since they have similar
            conclusions. HOWEVER OUR PROBLEM IS WHEN THE RELATIONSHIP BETWEEN A ROLE
            IS AMBIGOUS TO FIELD. For example data scientists are no longer needed for
            data ingestion, and data injestion is only handled by "Field_X". This
            obscures the conclusion that the responsibilities of "Field_X" must be
            adjusted since data scientists are hired in many fields.

          - Changes to work-descriptions might be a matter of magnitude rather than role,
            with one persone leveraging AI to do the work of several.

        outstanding: &outstanding3t
          - Are fields a necessary intermediate between SBP and work-descriptions?
          - How does doing field-wise analysis (mapping onto work-descriptions) compare
            to mapping agency-wide updates to work-descriptions to field responsibilities?

  - topic: Project Objective
    summary: null
    background: null
    details:
      - item: Limited scope
        summary: >
          Summarization of proposed changes to GSBPM is enough work to do well before
          the end of september.
        background: null
        details:
          - The summarization could serve as a proof of concept for future work.
          - Impossible to tell prior to attempt.
          - LG so start laying groundwork for pushing off second analysis
            (work-description updates).
          - Alternative is to limit results from work-description analysis to three
            hand-picked descriptions. Doing so will reduce the amount of validation
            required (at least for SME).
           
      - item: Closing misalignment between work-descriptions and job-descriptions
        summary: >
          Closing misalignment between work-descriptions and job-descriptions could be a
          primary or secondary objective. Doing so may have unintended consequences for
          hiring expediency.
        background:
          - Work-descriptions are largely outdated and there exists substantial misalignment
            between work-descriptions and jobs.
          - Work-descriptions are written in a very generic way, so to provide a flexible tool
            for justifiying hiring into existing boxes. This is a feature, not a bug.
          - The original request from Saeid did not mention closing the gap.
        details:
          - Closing the gap between work-descriptions and job-descriptions may come at a price
            of loosing the generality of work-descriptions. This could cause consequences for
            some (HR) since the generality is something they rely upon.

          - Updates to work-descriptions don't have to remove generality.. they could just be
            updated.
        outstanding: &outstanding4ti1
          - Is closing the gap between work-descriptions and job-descriptions an objective for
            our analysis?


        
