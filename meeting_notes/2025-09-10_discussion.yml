discussion:
  - topic: GSBPM updates to work-description mapping process design
    summary: >
      Scrape work-descriptions, do a reverse-mapping onto GSPBM processes, then flag
      implicated work-desriptions.
    background:
      - work-descriptions are very generic.
    details:
      - item: architecture logic
        summary: null
        background: null
        details:
          - It is unlikely that the key-activities of work-descriptions (WDKA) would suffice
            to reconstruct the SBP of the GSBPM.
          - LLM could identify (WDKA) required for a given SBP.
          - Work-descriptions with a key-activity identigied as necessary for a SBP are
            implicated with that SBP.
          - Changes to an SBP presents possible changes to its implicated work-descriptions.
        outstanding: &outstanding1ti1
          - The relationship between SBP update and key-activity update is ambigous.
          - The relationship between SBP update and key-activity adjustment is likely
            dependent on the role (work-description)
          - Changes to SBP may be limited to a subset of key-activites. How to reliably
            evaluate if a key-activity is implicated?

      - item: Work-description key-activities (WDKA)
        summary: Implicate a work-description with an SBP
        background: key-activities in a work-description typically provide a summary.
        details: null
        outstanding: &outstanding1ti2
          - Could other elements of work-descriptions (such as skills) implicate it with an
            SBP? (consider analysis from the skills-gap survey.
          - Would de-duplication of key-activities among work-descriptions be necessary?
    outstanding:
      - *outstanding1ti1
      - *outstanding1ti2

