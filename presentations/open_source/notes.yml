  - item: design
    details:
      - item: The Zone
        summary: Gitlab CI/CD
        details:
          - items: overall

          - CI/CD pipeline maintains scraped content.
          - Workflow on The Zone could pull scraped content, then 
            query via AIEP.
          - Cronjob on The Zone could run script.
             zone.pages.cloud.statcan.ca/docs/en/Scheduling/k8s-cronjobs

          - AUTHENTICATION WITH AIEP TIMES-OUT, AND CAN'T BE 
            AUTOMATED.
          
          - item: outline
            details: |

               1) The Zone cron job pushes ping to GitLab scraper/
                  content repo.

               2) GitLab CI/CD refreshes data sources, pushing to 
                  static data repo.

               3) [Sometime later] Second cron job on The Zone, 
                  pulls scraped data from static data repo, then 
                  runs inference, finally pushing to Training 
                  Catalog repo.

               4) Training Catalog repo CI/CD compiles website and 
                  publishes changes to Gitlab pages.


          - item: detailed outline.
            details:

              - One "ping" repo w/ CI/CD that scrapes, and 
                refreshes data, then pushes to data repo.

              - One "data" repo, contains learning resource data, 
                fed by "ping" repo.

              - One Training Catalog repo, that contains inference.

              - One cron job to push "ping" to "ping repo", wait,
                then pull data in from "data repo",
                run inferene through AIEP....

           



