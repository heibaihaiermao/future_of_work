    Statistics Canada Prod Options Analysis
      - All of the projects that have successfully deployed at
        Stats that utilize OpenAI were enabled by the AIEP team,
        led by Louis-Simon.

      - With the help of the AIEP team, the SSC projects were
        rebuilt in CNP 2.0 (Cloud Native Platform 2.0)
          - This is the Kubernetes-focused option I mentioned before

      - In order to leverage OpenAI endpoints, AIEP is the
        only option currently available
          - You can either access these endpoints from The
            Zone, or CNP 2.0, as mentioned earlier
          - Both of these environments are Protected B
          - CNP 2.0 has access to the internet, while The
            Zone doesn’t
              - If you need a front-end deployed as well,
                then CNP 2.0 is also your only option

          - You would be able to develop & deploy automated
            applications that do not require internet access
            via The Zone (best use case for The Zone)

          - Outside of that, CNP 2.0 remains the best option
            for Production workloads

      - There does *not* exist a separate, non-protected Azure
        OpenAI endpoint with internet access
          - This means that developing your application on
            the SSC platform (internet access, open dev
            environment), then using your learnings to
            deploy in the CNP 2.0 environment, is
            currently the best method to build OpenAI
            related applications that require internet access

      - All of this is subject to change, as AIEP is rapidly
        building & developing their enablement capabilities,
        and have more services/options planned in next fiscal
        most likely

